# GitHub Actions CI：推送到 GitHub 时自动编译。
#
# 工具链与本地一致（详见 docs/build-and-release.md §9）：
#   AGP 9.2.1 / Gradle wrapper 9.4.1 / JDK 21 / compileSdk 37.2（minor API）/ build-tools 37.0.0。
#
# Android SDK 直接使用 GitHub runner 预装版本（ubuntu-latest 镜像自带 ANDROID_HOME、
# platforms;android-37.2 与 build-tools;37.0.0，见 images/ubuntu/Ubuntu2604-Readme.md）；
# 不再通过 android-actions/setup-android 下载/安装：该 action 在 Ubuntu 26 镜像上安装
# cmdline-tools 失败（2026-10-21 首次 CI 运行实测），而预装 SDK 已含所需组件。
#
# 说明：
# - 不在仓库里的 local.properties 不是必需项：百度 AK 注入空串、release 签名跳过，
#   不影响 Debug 编译（CI 通过 ANDROID_HOME/ANDROID_SDK_ROOT 提供 SDK 路径）；
# - Debug 只编 arm64-v8a 一个变体作为「代码可编译」的代表（其余 flavor 只差 ABI 打包，
#   编译期无差异）；需要全变体时可把任务改成 :main:assembleDebug；
# - APK 作为 workflow artifact 上传，保留 7 天。
name: CI

on:
  # 推送到任意分支/标签都触发
  push:
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的新推送取消仍在进行的旧任务，避免浪费排队时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译（arm64-v8a Debug）
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 镜像预装 Android SDK；这里只做存在性检查，缺失时打印实际内容便于排查
      - name: 检查 Android SDK（runner 预装）
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT/platforms/android-37.2" ]; then
            echo "::error::runner 缺少 platforms;android-37.2（compileSdk 需要）"
            ls "$SDK_ROOT/platforms" 2>/dev/null || true
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/build-tools/37.0.0" ]; then
            echo "::error::runner 缺少 build-tools;37.0.0"
            ls "$SDK_ROOT/build-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Android SDK 预装组件齐全：platforms/android-37.2、build-tools/37.0.0"

      - name: 准备 Gradle 包装器
        run: chmod +x ./gradlew

      - name: 编译 Debug APK（arm64-v8a）
        run: ./gradlew :main:assembleArm64Debug --stacktrace

      - name: 单元测试
        run: |
          ./gradlew \
            :main:testArm64DebugUnitTest \
            :main-ui:testDebugUnitTest \
            :core-data:testDebugUnitTest \
            :common-util:testDebugUnitTest \
            --stacktrace

      - name: 色板配对校验
        run: python3 scripts/check-color-pairs.py

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SenkGallery-Debug-arm64
          path: main/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 7
