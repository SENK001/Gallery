plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.senk.gallery.ui'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        minSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        // 纯 JVM 单元测试（SelectionStateTest 等）：android.jar 的静态方法默认抛
        // "not mocked"，这里返回默认值，使被测逻辑里防御性的 Log.e 分支也能在 JVM 上跑到。
        unitTests.returnDefaultValues = true
    }

}

dependencies {
    // 百度地图 SDK 走 Maven Central（含 4 个 ABI 的 .so，无需本地 libs/baidumap 与 jniLibs.srcDir）。
    // 三个 Artifact 缺一不可：Search 提供 GeoCoder（逆地理编码）、Util 提供 CoordinateConverter。
    api libs.baidu.lbs.map
    api libs.baidu.lbs.search
    api libs.baidu.lbs.util
    api project(':core-data')
    api project(':common-util')
    // 外部调用契约（action / extra / result 常量）：选图页与外部大图模式都要读同一套约定。
    api project(':external-api')
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.kotlinx.coroutines.android
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}