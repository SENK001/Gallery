plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.senk.gallery.ui'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        minSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    // 百度地图 SDK 走 Maven Central（含 4 个 ABI 的 .so，无需本地 libs/baidumap 与 jniLibs.srcDir）。
    // 三个 Artifact 缺一不可：Search 提供 GeoCoder（逆地理编码）、Util 提供 CoordinateConverter。
    api libs.baidu.lbs.map
    api libs.baidu.lbs.search
    api libs.baidu.lbs.util
    api project(':core-data')
    api project(':common-util')
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.kotlinx.coroutines.android
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}