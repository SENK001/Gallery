plugins {
    alias(libs.plugins.android.application)
}

// 百度地图 AK 与 release 签名口令都不进版本库：统一从 local.properties 读取（该文件已被 .gitignore 忽略）。
// 未配置 AK 时注入空串，SDK 初始化会失败但应用不崩溃（地图/逆地理编码功能不可用）。
// 未配置签名时 release 产出 main-release-unsigned.apk，不影响他人 clone 后构建。
// 配置方式见 README「百度地图 SDK 与 AK 配置」与「Release 签名」。
def localProps = new Properties()
def propsFile = rootProject.file('local.properties')
if (propsFile.exists()) {
    propsFile.withInputStream { localProps.load(it) }
}
def baiduMapApiKey = localProps.getProperty('BAIDU_MAP_API_KEY', '')

// release 签名：四项缺一不可，任一缺失即视为未配置（产出未签名包）。
// 注意：口令只存在于 local.properties，绝不可写死在本文件里。
def releaseStoreFile = localProps.getProperty('RELEASE_STORE_FILE', '')
def releaseStorePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyAlias = localProps.getProperty('RELEASE_KEY_ALIAS', '')
def releaseKeyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.senk.gallery'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.senk.gallery"
        minSdk 36
        targetSdk 36
        versionCode 10000000 //xx.xx.xx.xxx
        versionName "1.0.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [baiduMapApiKey: baiduMapApiKey]

        // ABI 过滤：按当前连接的设备动态决定，没插设备时退回 arm64-v8a。
        // 原因：百度地图 SDK 自带 4 个 ABI 的 .so，全打包 APK ≈90MB、只留 arm64-v8a ≈39MB；
        // 但 arm64-v8a 的包装不进 x86_64 模拟器，而模拟器调试很常用。
        // 探测逻辑与全部覆盖项（-Pgallery.abiFilters / .abiAuto / .adb / .abiDeviceSerial）
        // 见根 build.gradle 顶部注释。
        def resolvedAbis = rootProject.galleryAbiFilters()
        logger.lifecycle("[abi] :main abiFilters = ${resolvedAbis ?: '(未过滤，打包全部 ABI)'}")
        ndk {
            if (!resolvedAbis.isEmpty()) {
                abiFilters.addAll(resolvedAbis)
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // 同时启用 v1/v2/v3：v2+ 为 Android 7+ 必需，v1 兼容更早系统
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    api project(':main-ui')
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // MainActivity / MainPagerAdapter 直接使用 ViewPager2 与 FragmentStateAdapter，
    // 必须显式声明：此前依赖 material 的传递依赖，material 一旦收紧依赖即编译失败。
    implementation libs.androidx.viewpager2
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}