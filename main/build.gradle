plugins {
    alias(libs.plugins.android.application)
}

// 百度地图 AK 与 release 签名口令都不进版本库：统一从 local.properties 读取（该文件已被 .gitignore 忽略）。
// 未配置 AK 时注入空串，SDK 初始化会失败但应用不崩溃（地图/逆地理编码功能不可用）。
// 未配置签名时 release 产出 main-release-unsigned.apk，不影响他人 clone 后构建。
// 配置方式见 README「百度地图 SDK 与 AK 配置」与「Release 签名」。
def localProps = new Properties()
def propsFile = rootProject.file('local.properties')
if (propsFile.exists()) {
    propsFile.withInputStream { localProps.load(it) }
}
def baiduMapApiKey = localProps.getProperty('BAIDU_MAP_API_KEY', '')

// release 签名：四项缺一不可，任一缺失即视为未配置（产出未签名包）。
// 注意：口令只存在于 local.properties，绝不可写死在本文件里。
def releaseStoreFile = localProps.getProperty('RELEASE_STORE_FILE', '')
def releaseStorePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyAlias = localProps.getProperty('RELEASE_KEY_ALIAS', '')
def releaseKeyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.senk.gallery'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.senk.gallery"
        minSdk 36
        targetSdk 36
        versionCode 10000000 //xx.xx.xx.xxx
        versionName "1.0.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [baiduMapApiKey: baiduMapApiKey]

        // ABI 过滤：按当前连接的设备动态决定，没插设备时退回 arm64-v8a。
        // 原因：百度地图 SDK 自带 4 个 ABI 的 .so，全打包 APK ≈90MB、只留 arm64-v8a ≈39MB；
        // 但 arm64-v8a 的包装不进 x86_64 模拟器，而模拟器调试很常用。
        // 探测逻辑与全部覆盖项（-Pgallery.abiFilters / .abiAuto / .adb / .abiDeviceSerial）
        // 见根 build.gradle 顶部注释。
        def resolvedAbis = rootProject.galleryAbiFilters()
        logger.lifecycle("[abi] :main abiFilters = ${resolvedAbis ?: '(未过滤，打包全部 ABI)'}")
        ndk {
            if (!resolvedAbis.isEmpty()) {
                abiFilters.addAll(resolvedAbis)
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // 同时启用 v1/v2/v3：v2+ 为 Android 7+ 必需，v1 兼容更早系统
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// ---------------------------------------------------------------------------
// APK 产物改名：main-debug.apk -> SenkGallery-Debug.apk，release 同理
//
// 为什么不直接改 AGP 的输出名：
// AGP 8 起 `applicationVariants.all { outputFileName = ... }` 已随老 Variant API 一并移除，
// 新 API 里 `BuiltArtifact.outputFile` 是只读的 String（已核对 AGP 9.2.1 源码
// gradle-api-9.2.1-sources.jar 的 BuiltArtifact.kt），没有公开写法能在打包时改文件名。
// 唯一官方途径是 Artifacts.transform + BuiltArtifacts.save()，需要 WorkAction 与
// BuiltArtifactsLoader，为改个名字引入这套东西不值当。
//
// 这里改为「AGP 照常产出标准名，构建完成后复制一份改好名的副本」：
//   main/build/outputs/apk/debug/main-debug.apk            AGP 标准产物，保持不变
//   main/build/outputs/renamed/debug/SenkGallery-Debug.apk  改名副本（字节相同）
// 标准产物仍在原路径，Android Studio 的 Run/Debug 与 installDebug/installRelease
// 都靠 output-metadata.json + 标准文件名定位，因此完全不受影响，只是多出一份副本。
// 副本放在 outputs/renamed/ 而不是 outputs/apk/ 下面：必须与 apkDir 这个
// @InputDirectory 平级，不能嵌进去，否则副本自身会成为「输入」的一部分，
// 造成任务每次都要重跑。两份都会随 clean 一起清除。
// ---------------------------------------------------------------------------
abstract class RenameApkTask extends DefaultTask {

    /** AGP 打包出标准 APK 的目录（约定路径 outputs/apk/<variant>）。 */
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getApkDir()

    /** 改名副本的输出目录（与 apkDir 平级，不嵌套）。 */
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    /** 目标文件名，如 SenkGallery-Debug.apk。 */
    @Input
    abstract Property<String> getDisplayName()

    @TaskAction
    void rename() {
        File apkDir = apkDir.get().asFile
        String target = displayName.get()
        // 标准产物的名字由 AGP 决定：配置了签名是 main-release.apk，未配置签名则是
        // main-release-unsigned.apk（见 README「Release 签名」）。因此执行期精确匹配
        // 这两个候选，而不是「挑任意一个 .apk」——后者会在目录里存在别的 apk 时选错。
        def apks = (apkDir.listFiles() ?: new File[0])
            .findAll { it.isFile() && it.name.endsWith('.apk') }
        File src = apks.find { it.name.endsWith('-unsigned.apk') }
            ?: apks.find { !it.name.endsWith('-unsigned.apk') }
        if (src == null) {
            throw new GradleException("[apk] 在 ${apkDir} 下没找到 .apk，无法改名为 ${target}")
        }
        if (apks.size() > 1) {
            logger.lifecycle("[apk] ${apkDir} 下有多个 apk ${apks*.name}，采用 ${src.name}")
        }

        File outDir = outputDir.get().asFile
        if (outDir.exists()) {
            outDir.deleteDir()   // 清掉上一次的副本，避免残留旧名文件
        }
        outDir.mkdirs()
        File dst = new File(outDir, target)
        dst.bytes = src.bytes
        logger.lifecycle("[apk] ${src.name} -> ${target}" +
            "  (${String.format('%.2f', dst.length() / 1024.0 / 1024.0)}MB)")
    }
}

// 变体名 -> 改名后的文件名。新增变体时在这里补一行即可。
def apkDisplayNames = [
    debug  : 'SenkGallery-Debug.apk',
    release: 'SenkGallery-Release.apk',
]

androidComponents {
    onVariants(selector().all()) { variant ->
        def displayName = apkDisplayNames[variant.name]
        if (displayName == null) {
            return
        }
        def variantName = variant.name
        def apkOutputDir = layout.buildDirectory.dir("outputs/apk/${variantName}")
        def renameTask = tasks.register("rename${variantName.capitalize()}Apk", RenameApkTask) {
            it.displayName.set(displayName)
            // 标准产物所在目录。用约定路径而不是 variant.artifacts.get(SingleArtifact.APK)：
            // 后者在 Groovy 里会因泛型擦除报
            // "Cannot cast java.lang.Class to com.android.build.api.artifact.Artifact$Single"，
            // 而该路径是 AGP 的稳定约定（与 output-metadata.json 同级）。
            it.apkDir.set(apkOutputDir)
            // 改名副本的输出目录：与 apkDir 平级，绝不能嵌在它里面。
            it.outputDir.set(layout.buildDirectory.dir("outputs/renamed/${variantName}"))
        }
        // package<Variant> 完成后再改名；assemble<Variant> 与 install<Variant>
        // 都会经过它，因此两条路径都能拿到改名副本。这里用 matching + configureEach
        // 延迟绑定：任务此刻还没注册，直接 tasks.named 会报 Task not found。
        tasks.matching { it.name == "package${variantName.capitalize()}" }.configureEach {
            it.finalizedBy(renameTask)
        }
    }
}

dependencies {
    api project(':main-ui')
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // MainActivity / MainPagerAdapter 直接使用 ViewPager2 与 FragmentStateAdapter，
    // 必须显式声明：此前依赖 material 的传递依赖，material 一旦收紧依赖即编译失败。
    implementation libs.androidx.viewpager2
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}